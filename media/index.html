<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{resetStyleUri}}" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>Controller Viewer</title>
  </head>
  <body>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dagre-d3@0.6.4/dist/dagre-d3.min.js"></script>
    <script src="{{scriptUri}}"></script>
    <main>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-node initial"></div>
          <span>Initial state</span>
        </div>
        <div class="legend-item">
          <div class="legend-node normal"></div>
          <span>State</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch default"></div>
          <span>Transition</span>
        </div>
        <div class="legend-item" style="margin-left:auto; opacity:0.45; font-size:10px;">
          Scroll to zoom &nbsp;·&nbsp; Drag to pan
        </div>
      </div>
      <div id="sim-panel" class="sim-panel"></div>
      <ul id="controllers"></ul>
      <div id="console"></div>
    </main>
  </body>
</html>
